name: CloudStream Derleyici

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          path: src

      - name: Builds dalını al
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Eklentiyi derle
        working-directory: src
        run: gradle make makePluginsJson

      - name: Derlemeleri builds dalına aktar
        run: |
          set -e
          rm -f builds/*.cs3
          cp src/**/build/*.cs3 builds/
          cp src/build/plugins.json builds/plugins.json
          cd builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Build CloudStream plugins"
          git push origin builds
